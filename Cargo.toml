[package]
name = "cross-network-market-maker"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Native Rust regtest cross-network market-maker and atomic-swap research POC"
publish = false

[lib]
name = "cross_network_market_maker"
path = "src/lib.rs"

[[bin]]
name = "xmm"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
bitcoin = { version = "0.32.9", features = ["serde"] }
elements = { version = "0.27.0", features = ["serde"] }
base64 = "0.22.1"
clap = { version = "4.5.48", features = ["derive", "env"] }
hex = "0.4.3"
lightning-invoice = { version = "0.34.0", features = ["std"] }
rand = "0.8.8"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
percent-encoding = "2.3.1"
ripemd = "0.1.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
secp256k1 = { version = "0.29.1", features = ["rand-std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
thiserror = "2.0.18"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev]
incremental = false
debug = 0

[profile.test]
incremental = false
debug = 0
